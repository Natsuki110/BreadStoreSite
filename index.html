<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おうちぱん工房</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <img src="images/icon/hamburger.png" alt="メニュー" class="menu-icon" onclick="toggleMenu()">
    </div>
    <div class="header-center">
      <div class="logo">おうちぱん工房</div>
    </div>
    <div class="header-right">
      <a href="cart.html" class="cart-icon">
        <img src="images/icon/cart.png" alt="カート" />
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <!-- ハンバーガーメニュー -->
  <nav id="hamburgerMenu" class="hidden">
    <ul>
      <li><a href="#">新規会員登録</a></li>
      <li><a href="#">ログイン</a></li>
      <li>
        <input type="text" placeholder="パンを検索..." />
      </li>
      <li>
        カテゴリーから探す
        <ul class="category-list">
          <li><a href="#">お惣菜パン</a></li>
          <li><a href="#">甘いパン</a></li>
          <li><a href="#">ハード系</a></li>
        </ul>
      </li>
      <li><a href="#">お問い合わせ</a></li>
    </ul>
  </nav>

  <!-- スライダー画像 -->
  <section class="slider">
    <div class="slider-wrapper" id="sliderWrapper">
      <img src="images/slider-images/season-breads.jpg" alt="春のパン特集" />
      <img src="images/slider-images/osusume.jpg" alt="春のパン特集" />
      <img src="images/slider-images/oishitabekata.jpg" alt="春のパン特集" />
    </div>
    
    <!-- ← → ボタン -->
    <button class="slider-arrow left" onclick="prevSlide()">&#10094;</button>
    <button class="slider-arrow right" onclick="nextSlide()">&#10095;</button>
    
    <!--ドットナビゲーション-->
    <div class="slider-dots" id="sliderDots"></div>
  </section>

  <!-- パンランキング -->
  <section class="ranking section-container">
    <h2 class="section-title">
      <span class="line">RANKING</span>
    </h2>
    <div class="ranking-grid">
      <div class="ranking-item">
        <span class="rank-number">1</span>
        <img src="images/all-breads/hard.jpg" alt="ハードパン">
        <p class="bread-name">ハードパン</p>
        <p class="price">¥250</p>
      </div>
      <div class="ranking-item">
        <span class="rank-number">2</span>
        <img src="images/all-breads/melon-bread.jpg" alt="メロンパン">
        <p class="bread-name">メロンパン</p>
        <p class="price">¥300</p>
      </div>
      <div class="ranking-item">
        <span class="rank-number">3</span>
        <img src="images/all-breads/chocolate-croissant.jpg" alt="チョコレートクロワッサン">
        <p class="bread-name">チョコレートクロワッサン</p>
        <p class="price">¥350</p>
      </div>
    </div>
    <div class="btn-wrap">
      <a href="all-breads.html" class="see-all-btn">▶︎ 全商品を見る</a>
    </div>
  </section>

  <!-- 最近チェックした商品 -->
  <section class="recently-viewed section-container">
    <h2 class="section-title">
      <span class="line">最近チェックした商品</span>
    </h2>
    <div class="recent-slider" id="recentItems">
      <!-- JSで追加 -->
    </div>
  </section>

  <footer>
    <p>&copy; 2025 おうちぱん工房</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/top.js"  defer></script>
</body>
</html>
